<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Workout Timer</h1>
        <div id="countdown">00:00</div>
        <div id="progress-container">
            <div id="progress"></div>
        </div>
        <div id="counter">Rep 0/0, Set 0/0</div> <!-- Added Counter -->
        <div class="controls">
            <button id="pause-btn" onclick="pauseWorkout()">Pause</button>
            <button id="skip-btn" onclick="skipPhase()">Skip</button>
            <button id="rewind-btn" onclick="rewindPhase()">Rewind</button>
        </div>
        <div class="modes">
            <button onclick="startTimer('3x12')">3 x 12</button>
            <button onclick="startTimer('2xLong1xSemi')">2 x Long / 1 x Semi</button>
            <button onclick="startTimer('2xSemi1xLong')">2 x Semi / 1 x Long</button>
        </div>
        <div id="custom-timer" style="margin-top: 20px; text-align: center;">
            <h3 style="color: #444; font-size: 1.5rem; margin-bottom: 10px;">Standard Timer</h3>
            <div style="display: inline-block; text-align: left;">
              <label for="timer-duration" style="font-size: 1rem; color: #555; display: block; margin-bottom: 5px;">
                Enter Timer Duration:
              </label>
              <input
                type="number"
                id="timer-duration"
                placeholder="Seconds (e.g., 60)"
                style="padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 5px; width: 150px; text-align: center;"
              />
            </div>
            <button
              onclick="handleStartCustomTimer()"
              style="margin-left: 10px; padding: 10px 20px; font-size: 1rem; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;"
            >
              Start Timer
            </button>
          </div>                  
    </div>
    <script src="script.js"></script>
</body>
</html>
